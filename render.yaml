# Render Blueprint — provisions the Flask API only.
# Database is Neon (free, doesn't expire) — set DATABASE_URL manually in the
# Render dashboard after deploying. See DEPLOY.md.
# In the Render dashboard: New → Blueprint → point at this repo.
services:
  - type: web
    name: expense-splitter-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false   # set to your Neon connection string
      - key: FRONTEND_ORIGIN
        sync: false   # set to your Vercel URL after the frontend deploys
