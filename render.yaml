# Render Blueprint — provisions the Flask API + a free Postgres database.
# In the Render dashboard: New → Blueprint → point at this repo.
services:
  - type: web
    name: expense-splitter-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: expense-splitter-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false   # set to your Vercel URL after the frontend deploys

databases:
  - name: expense-splitter-db
    plan: free
